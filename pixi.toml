[workspace]
name = "obsidian-kit"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64"]

[dependencies]
nodejs = ">=24,<25"
# базовый reference.docx для генерации стилей берётся у этого pandoc
pandoc = ">=3.7,<4"

[tasks]
install = { cmd = "npm ci", inputs = ["package-lock.json"], outputs = ["node_modules/.package-lock.json"] }
build = { cmd = "npm run build", depends-on = ["install"] }
typecheck = { cmd = "npm run typecheck", depends-on = ["install"] }
